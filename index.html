<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupe du Monde - API Tracker</title>
    
    <meta name="theme-color" content="#10b981">
    <meta name="description" content="Suivez les résultats de la Coupe du Monde en direct.">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #10b981;
            --accent: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: var(--primary);
        }

        .api-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: var(--card-bg);
            color: white;
            font-size: 1rem;
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        main {
            width: 100%;
            max-width: 600px;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-left: 4px solid var(--accent);
        }

        .match-status {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .team {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
        }

        .score {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .error-msg {
            background: #ef4444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏆 Coupe du Monde</h1>
        <p style="color: var(--text-muted);">Résultats en direct (Football-Data.org)</p>
        
        <div class="api-input-container">
            <input type="password" id="apiKey" placeholder="Colle ton Token API ici" />
            <button onclick="saveTokenAndFetch()">Suivre</button>
        </div>
        <div id="errorContainer"></div>
    </header>

    <main id="matchesContainer">
        <p class="loading">Entre ton token API pour charger les matchs de la compétition (WC).</p>
    </main>

    <script>
        // Code de la compétition : 'WC' correspond à la Coupe du Monde chez football-data.org
        const COMPETITION_CODE = 'WC'; 
        const BASE_URL = 'https://api.football-data.org/v4';

        // Charger le token sauvegardé au démarrage
        document.getElementById('apiKey').value = localStorage.getItem('fb_api_token') || '';

        if(localStorage.getItem('fb_api_token')) {
            fetchMatches();
        }

        function saveTokenAndFetch() {
            const token = document.getElementById('apiKey').value.trim();
            if (!token) return alert('Veuillez entrer un token valide');
            localStorage.setItem('fb_api_token', token);
            fetchMatches();
        }

        async function fetchMatches() {
            const token = localStorage.getItem('fb_api_token');
            const container = document.getElementById('matchesContainer');
            const errorContainer = document.getElementById('errorContainer');
            
            container.innerHTML = '<p class="loading">Chargement des matchs...</p>';
            errorContainer.innerHTML = '';

            try {
                // Utilisation d'un proxy CORS si nécessaire sur Vercel, 
                // mais football-data.org accepte généralement les requêtes du navigateur si le bon header est là.
                const response = await fetch(`${BASE_URL}/competitions/${COMPETITION_CODE}/matches`, {
                    headers: { 'X-Auth-Token': token }
                });

                if (!response.ok) {
                    throw new Error(`Erreur API: ${response.status} (Vérifie ton Token ou ton plan d'abonnement)`);
                }

                const data = await response.json();
                displayMatches(data.matches);

            } catch (error) {
                errorContainer.innerHTML = `<div class="error-msg">${error.message}</div>`;
                container.innerHTML = '<p class="loading">Impossible de charger les données.</p>';
            }
        }

        function displayMatches(matches) {
            const container = document.getElementById('matchesContainer');
            if (!matches || matches.length === 0) {
                container.innerHTML = '<p class="loading">Aucun match trouvé pour cette compétition.</p>';
                return;
            }

            // On trie ou filtre pour n'afficher que les plus pertinents (ex: les 20 premiers ou en cours)
            container.innerHTML = matches.slice(0, 25).map(match => {
                const date = new Date(match.utcDate).toLocaleDateString('fr-FR', {
                    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                });
                
                const homeScore = match.score.fullTime.home ?? '-';
                const awayScore = match.score.fullTime.away ?? '-';

                return `
                    <div class="match-card">
                        <div class="match-status">${match.status} | ${date}</div>
                        <div class="teams">
                            <div class="team">
                                <span>${match.homeTeam.name || 'À déterminer'}</span>
                                <span class="score">${homeScore}</span>
                            </div>
                            <div class="team">
                                <span>${match.awayTeam.name || 'À déterminer'}</span>
                                <span class="score">${awayScore}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- Enregistrement du Service Worker pour la PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker enregistré !', reg.scope))
                    .catch(err => console.log('Échec de l\'enregistrement du SW :', err));
            });
        }
    </script>
</body>
</html>
